# Ambiente LOCAL de desenvolvimento (Doc 2 §58/§59).
# Apenas Postgres local para migrations/testes. NÃO é Supabase. NÃO é produção.
# (Docker não está instalado no ambiente de construção desta fase; arquivo pronto para uso local.)

services:
  db:
    image: postgres:16
    container_name: vitaloop_db_dev
    environment:
      POSTGRES_USER: vitaloop
      POSTGRES_PASSWORD: vitaloop
      POSTGRES_DB: vitaloop_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - vitaloop_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaloop"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vitaloop_db_data:
