# Orquestração de Produção / Staging Local (Doc 2 §58/§59; PRD-001).
# RLS ativada via role vitaloop_app; Nível de privilégio mínimo.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: vitaloop_api_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ALLOWED_ORIGINS: "https://app.vitaloop.com.br"
    ports:
      - "3000:3000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: vitaloop_web_prod
    ports:
      - "80:80"
    restart: always
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
